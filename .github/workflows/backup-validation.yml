# Backup Validation Workflow
# Validates that database backups can be created and restored
# Runs weekly and can be triggered manually

name: Backup Validation

on:
  schedule:
    # Run every Monday at 3:00 AM UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full_restore_test:
        description: "Run full restore test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password_ci_only
  POSTGRES_DB: test_db

jobs:
  validate-backup-scripts:
    name: Validate Backup Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate backup script syntax
        run: |
          bash -n infrastructure/scripts/backup.sh
          echo "✓ backup.sh syntax is valid"

      - name: Validate restore script syntax
        run: |
          if [ -f infrastructure/scripts/restore.sh ]; then
            bash -n infrastructure/scripts/restore.sh
            echo "✓ restore.sh syntax is valid"
          else
            echo "ℹ️ restore.sh not found (optional)"
          fi

      - name: Check backup script permissions
        run: |
          if [ -x infrastructure/scripts/backup.sh ]; then
            echo "✓ backup.sh is executable"
          else
            echo "⚠️ backup.sh is not executable"
          fi

  backup-restore-test:
    name: Backup & Restore Test
    runs-on: ubuntu-latest
    needs: validate-backup-scripts

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test data
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} << 'EOF'
          CREATE TABLE backup_test (
            id SERIAL PRIMARY KEY,
            data VARCHAR(255),
            created_at TIMESTAMP DEFAULT NOW()
          );
          INSERT INTO backup_test (data) VALUES
            ('test_row_1'),
            ('test_row_2'),
            ('test_row_3');
          EOF
          echo "✓ Test data created"

      - name: Create backup
        run: |
          mkdir -p backups
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} pg_dump \
            -h localhost \
            -U ${{ env.POSTGRES_USER }} \
            -d ${{ env.POSTGRES_DB }} \
            > backups/test_backup.sql

          # Validate backup file
          if [ ! -s backups/test_backup.sql ]; then
            echo "❌ Backup file is empty!"
            exit 1
          fi

          # Check backup contains expected content
          if grep -q "backup_test" backups/test_backup.sql && \
             grep -q "test_row_1" backups/test_backup.sql; then
            echo "✓ Backup created and validated"
          else
            echo "❌ Backup doesn't contain expected data!"
            exit 1
          fi

      - name: Compress backup
        run: |
          gzip backups/test_backup.sql
          if [ -f backups/test_backup.sql.gz ]; then
            echo "✓ Backup compressed successfully"
            ls -lh backups/test_backup.sql.gz
          else
            echo "❌ Compression failed!"
            exit 1
          fi

      - name: Test restore from backup
        if: ${{ github.event.inputs.full_restore_test != 'false' }}
        run: |
          # Drop existing data
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} \
            -c "DROP TABLE IF EXISTS backup_test;"

          # Decompress and restore
          gunzip backups/test_backup.sql.gz
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost \
            -U ${{ env.POSTGRES_USER }} \
            -d ${{ env.POSTGRES_DB }} \
            < backups/test_backup.sql

          # Verify data restored
          ROW_COUNT=$(PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost \
            -U ${{ env.POSTGRES_USER }} \
            -d ${{ env.POSTGRES_DB }} \
            -t -c "SELECT COUNT(*) FROM backup_test;")

          if [ "$ROW_COUNT" -eq 3 ]; then
            echo "✓ Restore successful - $ROW_COUNT rows recovered"
          else
            echo "❌ Restore failed - expected 3 rows, got $ROW_COUNT"
            exit 1
          fi

      - name: Test backup integrity
        run: |
          echo "Backup validation summary:"
          echo "=========================="
          echo "✓ Backup script syntax valid"
          echo "✓ Backup created successfully"
          echo "✓ Backup compression working"
          if [ "${{ github.event.inputs.full_restore_test }}" != "false" ]; then
            echo "✓ Restore verified successfully"
          fi
          echo "=========================="
          echo "All backup validation tests passed!"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [validate-backup-scripts, backup-restore-test]
    if: failure()

    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ Backup Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more backup validation tests failed." >> $GITHUB_STEP_SUMMARY
          echo "Please investigate immediately - backup integrity may be compromised." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
