# Deploy to Staging Environment
# Automatically deploys to staging after successful CI on main branch
# Can also be triggered manually

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run database migrations"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_smoke_tests:
        description: "Run smoke tests after deployment"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Only allow one deployment at a time
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run if CI passed or manual trigger
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: staging
      url: https://staging.deepagents.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add staging host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup before deployment
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents/infrastructure
            ./scripts/backup.sh --quick
          EOF

      - name: Pull latest changes
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents
            git fetch origin main
            git checkout main
            git pull origin main
          EOF

      - name: Deploy application
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents/infrastructure

            # Set environment variables
            export COMPOSE_FILE=docker-compose.staging.yml

            # Build and restart services
            docker-compose build --no-cache
            docker-compose up -d

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30
          EOF

      - name: Run database migrations
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents/infrastructure
            docker-compose -f docker-compose.staging.yml exec -T backend alembic upgrade head
          EOF

      - name: Run smoke tests
        if: ${{ github.event.inputs.run_smoke_tests != 'false' }}
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents/infrastructure
            ./scripts/smoke-test.sh --staging
          EOF

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment to staging completed successfully!"
          echo "URL: https://staging.deepagents.example.com"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/deepagents/infrastructure
            echo "Deployment failed, rolling back..."

            # Restore from latest backup
            LATEST_BACKUP=$(ls -t backups/*.manifest | head -1 | sed 's/.manifest//')
            if [ -n "$LATEST_BACKUP" ]; then
              ./scripts/restore.sh "$LATEST_BACKUP" --postgres-only --yes
            fi

            # Restart with previous images
            docker-compose -f docker-compose.staging.yml up -d
          EOF

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          channel: "#deployments"
          fields: repo,message,commit,author,action,eventName,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Create deployment status comment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.deploy.result }}';
            const emoji = status === 'success' ? ':white_check_mark:' : ':x:';
            console.log(`Deployment ${status} ${emoji}`);
        continue-on-error: true
